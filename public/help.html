<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="EventVerse Help Center — AI chatbot, FAQ, and direct support. Get answers instantly.">
<title>Help Center — EventVerse</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<link rel="stylesheet" href="css/main.css"></head>
<body><div id="header-placeholder"></div>
<main class="page-top" style="padding-bottom:60px"><div class="container" style="padding-top:28px">
  <div style="text-align:center;margin-bottom:28px"><div class="section-tag" style="margin:0 auto 10px;width:fit-content">💬 Help Center</div><h1 style="font-family:Poppins,sans-serif;font-size:clamp(24px,5vw,40px);font-weight:900;color:#fff;margin-bottom:6px">How Can We <span class="gradient-text">Help?</span></h1><p style="color:#64748b;font-size:14px">AI assistant 24/7 · Human support Mon–Sat 9AM–10PM</p></div>
  <div style="display:grid;grid-template-columns:1fr;gap:20px;max-width:900px;margin:0 auto">
    <div style="background:#1A1A2E;border:1px solid rgba(108,43,217,.2);border-radius:20px;display:flex;flex-direction:column;height:min(580px,70vh)">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;background:linear-gradient(135deg,rgba(108,43,217,.15),rgba(236,72,153,.08));border-radius:20px 20px 0 0">
        <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6C2BD9,#EC4899);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px">🤖</div>
        <div><div style="color:#fff;font-size:14px;font-weight:700">EventVerse AI</div><div style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:#22C55E;display:inline-block;animation:ping 2s infinite"></span><span style="color:#22C55E;font-size:11px">Online · Instant replies</span></div></div>
      </div>
      <div id="chat-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px"></div>
      <div style="padding:0 14px 8px;display:flex;gap:6px;overflow-x:auto;flex-shrink:0" class="scrollbar-hide">
        <button onclick="sendMsg('How do I download my ticket?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Download ticket</button>
        <button onclick="sendMsg('Which payment methods work?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Payment methods</button>
        <button onclick="sendMsg('How do I get a refund?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Refund policy</button>
        <button onclick="sendMsg('How does hotel booking work?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Hotel booking</button>
        <button onclick="sendMsg('How does Stadium Booking work?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Stadium booking</button>
        <button onclick="sendMsg('How Do Promo Codes Works?')" style="padding:5px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;color:#94a3b8;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0">Promo codes</button>
      </div>
      <form onsubmit="handleChatSubmit(event)" style="padding:12px 14px;border-top:1px solid rgba(255,255,255,.05);display:flex;gap:8px;flex-shrink:0">
        <input id="chat-input" class="ev-input" placeholder="Ask anything..." style="flex:1;min-width:0;height:40px;font-size:14px" autocomplete="off">
        <button type="submit" class="btn btn-primary" style="flex-shrink:0;width:40px;height:40px;padding:0;font-size:18px">↑</button>
      </form>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
      <div style="background:#1A1A2E;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px">
        <h3 style="color:#fff;font-size:14px;font-weight:700;margin-bottom:14px">📞 Contact Us</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          <a href="tel:+18004386837" style="display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.06)"><span style="font-size:20px">📞</span><div><div style="color:#94a3b8;font-size:10px">Phone</div><div style="color:#A78BFA;font-size:13px;font-weight:600">+1 (800) EVENTVERSE</div></div></a>
          <a href="mailto:support@eventverse.com" style="display:flex;align-items:center;gap:10px;text-decoration:none;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.06)"><span style="font-size:20px">✉️</span><div><div style="color:#94a3b8;font-size:10px">Email</div><div style="color:#A78BFA;font-size:13px;font-weight:600;word-break:break-all">support@eventverse.com</div></div></a>
          <div style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;border:1px solid rgba(255,255,255,.06)"><span style="font-size:20px">🕐</span><div><div style="color:#94a3b8;font-size:10px">Hours</div><div style="color:#fff;font-size:12px;font-weight:600">Mon–Sat, 9AM–10PM EST</div></div></div>
        </div>
      </div>
      <div style="background:#1A1A2E;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:20px">
        <h3 style="color:#fff;font-size:14px;font-weight:700;margin-bottom:14px">❓ Quick FAQ</h3>
        <div style="display:flex;flex-direction:column;gap:2px" id="faq-list"></div>
      </div>
    </div>
  </div>
</div></main>
<div id="footer-placeholder"></div>
<script src="js/ev-core-data.js"></script><script src="js/ev-extra-data.js"></script><script src="js/store.js"></script><script src="js/components.js"></script>
<script>
const FAQ=[
  {q:'How do I download my ticket?',a:'Go to My Tickets and click Download Ticket — it downloads as an HTML file that prints to PDF with a QR code.'},
  {q:'Which payment methods work?',a:'Crypto (BTC/ETH/USDT/BNB/SOL) and Gift Cards work fully. Uploading your payment proof/photo is required before you can submit.'},
  {q:'How long until booking is approved?',a:"Admin reviews within 1–24 hours. You'll get a notification when approved."},
  {q:'Can I get a refund?',a:'Email support@eventverse.com with your booking ID. Refunds available 48+ hours before the event.'},
  {q:'How does Hotel add-on work?',a:'On any event detail page, click the Hotels tab and select a nearby hotel. The total is added to your checkout automatically.'},
];
const faqList=document.getElementById('faq-list');
FAQ.forEach(f=>{
  const item=document.createElement('div');
  item.style.cssText='border:1px solid rgba(255,255,255,.06);border-radius:10px;overflow:hidden;margin-bottom:4px';
  item.innerHTML=`<button onclick="this.nextSibling.classList.toggle('hidden');this.querySelector('.faq-arrow').style.transform=this.nextSibling.classList.contains('hidden')?'':'rotate(90deg)'" style="width:100%;display:flex;align-items:start;justify-content:space-between;padding:10px 12px;background:none;border:none;cursor:pointer;color:#94a3b8;font-size:12px;text-align:left;gap:8px"><span style="word-wrap:break-word">${f.q}</span><span class="faq-arrow" style="flex-shrink:0;transition:transform .2s">▶</span></button><div class="hidden" style="padding:8px 12px 10px;color:#64748b;font-size:12px;line-height:1.6;border-top:1px solid rgba(255,255,255,.04);word-wrap:break-word">${f.a}</div>`;
  faqList.appendChild(item);
});

const RESP={
  ticket:()=>'Go to **My Tickets** to download your ticket with QR code! 🎟️',
  refund:()=>'Email **support@eventverse.com** with booking ID. Refunds available 48+ hours before events.',
  pay:()=>'✅ **Crypto** (BTC/ETH/USDT/BNB/SOL) and **Gift Cards** work fully. Upload proof is required. Other methods show maintenance messages. ₿🎁',
  hotel:()=>'On any event page, tap the 🏨 **Hotels tab** to see nearby properties and add them to your booking. Total is auto-calculated! 🏨',
  stadium:()=>'Visit **⚽ Stadium** in the nav, choose a match, pick your seat tier (VIP/Premium/Regular/Economy), pay with Crypto or Gift Card! ⚽',
  vip:()=>'VIP packages include Gold ($299), Platinum ($599), and Diamond ($999). Visit **/vip** to explore! 👑',
  promo:()=>'Promo codes give you discounts at checkout. Enter your code in the cart. Codes are **admin-controlled** — check notifications for active ones! 🎁',
  account:()=>'Go to **Sign In** and choose **Create Account**. Your bookings, tickets and favourites all sync automatically! 📱',
  contact:()=>'📞 **+1 (800) EVENTVERSE** · ✉️ **support@eventverse.com** · ⏰ Mon–Sat 9AM–10PM EST',
  hi:()=>"Hey! 👋 I'm EventVerse AI — here 24/7! Ask about tickets, payments, hotels, stadium matches or anything else!",
};
let typing=false;
const msgs=document.getElementById('chat-messages');
function addMsg(role,html){
  const d=document.createElement('div');
  d.style.cssText=`display:flex;align-items:start;gap:8px;${role==='user'?'flex-direction:row-reverse':''}`;
  const avatar=document.createElement('div');
  avatar.style.cssText=`width:30px;height:30px;border-radius:10px;${role==='ai'?'background:linear-gradient(135deg,#6C2BD9,#EC4899)':'background:rgba(255,255,255,.1)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px`;
  avatar.textContent=role==='ai'?'🤖':'👤';
  const bubble=document.createElement('div');
  bubble.style.cssText=`max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.6;word-wrap:break-word;${role==='ai'?'background:rgba(255,255,255,.05);color:#E2E8F0;border-radius:4px 16px 16px 16px':'background:#6C2BD9;color:#fff;border-radius:16px 4px 16px 16px'}`;
  bubble.innerHTML=html.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  d.appendChild(avatar); d.appendChild(bubble); msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){ const d=document.createElement('div'); d.id='typing-ind'; d.style.cssText='display:flex;align-items:center;gap:8px'; d.innerHTML='<div style="width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#6C2BD9,#EC4899);display:flex;align-items:center;justify-content:center;font-size:14px">🤖</div><div style="background:rgba(255,255,255,.05);padding:10px 14px;border-radius:4px 16px 16px 16px;display:flex;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:#64748b;animation:ping 1s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:#64748b;animation:ping 1s .2s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:#64748b;animation:ping 1s .4s infinite"></span></div>'; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; }
function hideTyping(){ document.getElementById('typing-ind')?.remove(); }
function getAIResponse(q){
  const ql=q.toLowerCase();
  if(/^(hi|hello|hey|sup|yo)\b/.test(ql)) return RESP.hi();
  if(ql.includes('ticket')&&(ql.includes('download')||ql.includes('get')||ql.includes('my'))) return RESP.ticket();
  if(ql.includes('refund')||ql.includes('cancel')) return RESP.refund();
  if(ql.includes('pay')||ql.includes('crypto')||ql.includes('giftcard')||ql.includes('payment')) return RESP.pay();
  if(ql.includes('hotel')||ql.includes('stay')||ql.includes('accommodation')) return RESP.hotel();
  if(ql.includes('stadium')||ql.includes('football')||ql.includes('match')) return RESP.stadium();
  if(ql.includes('vip')||ql.includes('premium')||ql.includes('exclusive')) return RESP.vip();
  if(ql.includes('promo')||ql.includes('discount')||ql.includes('code')) return RESP.promo();
  if(ql.includes('account')||ql.includes('register')||ql.includes('login')) return RESP.account();
  if(ql.includes('contact')||ql.includes('support')||ql.includes('human')||ql.includes('help')) return RESP.contact();
  if(ql.includes('thank')) return "You're welcome! 😊 Feel free to ask anything else! 💜";
  const s=EVStore.getState();
  if(s.user){
    EVStore.addNotification({id:'unresolved-'+Date.now(),userId:'ADMIN',title:'🆘 Unresolved User Question',message:`User (${s.user.name}, ${s.user.email}) asked: "${q}" — AI could not answer. Please reply.`,isRead:false,fromAdmin:false,createdAt:new Date().toISOString()});
    EVStore.addNotification({id:'pending-reply-'+Date.now(),userId:s.user.id,title:'💬 Question forwarded to support',message:`Your question: "${q}" has been sent to our team. You'll receive a reply here soon!`,isRead:false,fromAdmin:true,createdAt:new Date().toISOString()});
  }
  return `I'm not sure about that specific question — I've forwarded it to our support team! You'll receive a reply in your notifications soon.\n\nIn the meantime: 📧 **support@eventverse.com** · 📞 **+1 (800) EVENTVERSE** 💜`;
}
function sendMsg(q){
  if(!q.trim()||typing) return;
  addMsg('user',q); typing=true; showTyping();
  setTimeout(()=>{ hideTyping(); addMsg('ai',getAIResponse(q)); typing=false; },700+Math.random()*600);
}
function handleChatSubmit(e){ e.preventDefault(); const inp=document.getElementById('chat-input'); sendMsg(inp.value.trim()); inp.value=''; return false; }
window.sendMsg=sendMsg;
addMsg('ai',"Hey! 👋 I'm EventVerse AI, available 24/7. Ask me about tickets, bookings, payments, hotels, or anything else!");
</script></body></html>
