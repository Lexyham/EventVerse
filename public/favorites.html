<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Your saved favourite events on EventVerse.">
<title>Favourites — EventVerse</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
<link rel="stylesheet" href="css/main.css"></head>
<body><div id="header-placeholder"></div>
<main class="page-top" style="padding-bottom:60px"><div class="container" style="padding-top:28px">
  <h1 style="font-family:Poppins,sans-serif;font-size:clamp(22px,4vw,34px);font-weight:900;color:#fff;margin-bottom:4px">❤️ Favourites</h1>
  <p id="fav-count" style="color:#64748b;font-size:14px;margin-bottom:24px"></p>
  <div id="fav-empty" class="hidden" style="text-align:center;padding:60px 16px"><div style="font-size:56px;margin-bottom:14px">💜</div><h2 style="color:#fff;font-size:22px;margin-bottom:8px">No favourites yet</h2><p style="color:#64748b;margin-bottom:20px">Browse events and tap ❤️ to save them here.</p><a href="events.html" class="btn btn-primary">Browse Events</a></div>
  <div id="fav-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px"></div>
</div></main>
<div id="footer-placeholder"></div>
<script src="js/ev-core-data.js"></script><script src="js/ev-extra-data.js"></script><script src="js/store.js"></script><script src="js/components.js"></script>
<script>
function renderFavs(){
  const s=EVStore.getState();
  const favIds=s.favorites||[];
  document.getElementById('fav-count').textContent=`${favIds.length} saved event${favIds.length!==1?'s':''}`;
  if(!favIds.length){ document.getElementById('fav-empty').classList.remove('hidden'); document.getElementById('fav-grid').innerHTML=''; return; }
  document.getElementById('fav-empty').classList.add('hidden');
  const adminEvs=(s.adminEvents||[]).map(ae=>({id:ae.id,title:ae.title,artist:ae.artist||ae.title,category:ae.category,date:ae.date,image:ae.image||'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80',price:{min:ae.price?.min||0,currency:ae.price?.currency||'USD'},rating:4.5,hot:ae.hot,featured:ae.featured,city:ae.city,country:ae.country}));
  const allEvs=[...adminEvs,...events];
  const favEvents=favIds.map(id=>allEvs.find(e=>e.id===id)).filter(Boolean);
  document.getElementById('fav-grid').innerHTML=favEvents.map(e=>eventCardHTML(e)).join('');
}
renderFavs();
window.addEventListener('ev-state-change',renderFavs);
</script></body></html>
