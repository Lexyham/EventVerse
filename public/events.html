<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Browse 187+ live events — concerts, sports, arts, comedy and family events across 40+ countries.">
<title>Browse Events — EventVerse</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<link rel="stylesheet" href="css/main.css"></head>
<body><div id="header-placeholder"></div>
<main class="page-top" style="padding-bottom:60px">
  <div class="container" style="padding-top:28px">
    <div style="margin-bottom:24px"><h1 id="page-title" style="font-family:Poppins,sans-serif;font-size:clamp(22px,4vw,36px);font-weight:900;color:#fff;margin-bottom:4px">All Events</h1><p id="result-count" style="color:#64748b;font-size:14px">Loading events...</p></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px">
      <div style="position:relative;flex:1;min-width:200px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="search-input" type="search" class="ev-input" placeholder="Search events, artists, cities..." style="padding-left:38px" aria-label="Search events"></div>
      <select id="sort-select" class="ev-input" style="width:auto;min-width:130px" aria-label="Sort events"><option value="date">Sort: Date</option><option value="price">Sort: Price</option><option value="rating">Sort: Rating</option></select>
    </div>
    <div class="snap-scroll scrollbar-hide" style="margin-bottom:24px" role="navigation" aria-label="Filter by category" id="cat-pills"></div>
    <div id="events-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px"></div>
    <div id="no-results" class="hidden" style="text-align:center;padding:60px 16px"><div style="font-size:48px;margin-bottom:12px">🎟️</div><h3 style="color:#fff;font-size:20px;font-weight:700;margin-bottom:8px">No events found</h3><p style="color:#64748b;margin-bottom:20px">Try a different search or browse all events</p><button onclick="clearFilters()" class="btn btn-primary">Browse All Events</button></div>
  </div>
</main>
<div id="footer-placeholder"></div>
<script src="js/ev-core-data.js"></script><script src="js/ev-extra-data.js"></script><script src="js/store.js"></script><script src="js/components.js"></script>
<script>
let currentCat='all', currentQ='';
const qp=new URLSearchParams(window.location.search);
if(qp.get('cat')) currentCat=qp.get('cat');
if(qp.get('q')) currentQ=qp.get('q');

function renderCatPills(){
  const cats=[{id:'all',name:'All',icon:'🎫'}, ...categories];
  document.getElementById('cat-pills').innerHTML=cats.map(c=>`<button onclick="setCategory('${c.id}')" class="cat-btn" data-cat="${c.id}" style="padding:7px 16px;border-radius:20px;background:${c.id===currentCat?'#6C2BD9':'rgba(255,255,255,.05)'};color:${c.id===currentCat?'#fff':(c.id==='vip'?'#F59E0B':'#94a3b8')};border:1px solid ${c.id===currentCat?'transparent':'rgba(255,255,255,.1)'};cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0">${c.icon} ${c.name}</button>`).join('');
}
function setCategory(cat){
  currentCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>{
    const active=b.dataset.cat===cat;
    b.style.background=active?'#6C2BD9':'rgba(255,255,255,.05)';
    b.style.color=active?'#fff':(b.dataset.cat==='vip'?'#F59E0B':'#94a3b8');
    b.style.borderColor=active?'transparent':'rgba(255,255,255,.1)';
  });
  renderEvents();
}
function clearFilters(){ currentCat='all'; currentQ=''; document.getElementById('search-input').value=''; setCategory('all'); }
function mergedEvents(){
  const s=window.EVStore?EVStore.getState():{};
  const adminEvs=(s.adminEvents||[]).map(ae=>({id:ae.id,title:ae.title,artist:ae.artist||ae.title,category:ae.category,date:ae.date,image:ae.image||'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800&q=80',price:{min:ae.price?.min||0,currency:ae.price?.currency||'USD'},rating:4.5,hot:ae.hot,featured:ae.featured,trending:ae.trending,city:ae.city,country:ae.country}));
  return [...adminEvs,...events];
}
function renderEvents(){
  const q=document.getElementById('search-input').value.trim()||currentQ;
  const sort=document.getElementById('sort-select').value;
  let all=mergedEvents();
  if(currentCat!=='all') all=all.filter(e=>e.category===currentCat);
  if(q){ const ql=q.toLowerCase(); all=all.filter(e=>e.title.toLowerCase().includes(ql)||e.artist.toLowerCase().includes(ql)||e.city.toLowerCase().includes(ql)||e.country.toLowerCase().includes(ql)); }
  if(sort==='price') all.sort((a,b)=>a.price.min-b.price.min);
  else if(sort==='rating') all.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else all.sort((a,b)=>new Date(a.date)-new Date(b.date));
  const g=document.getElementById('events-grid'), nr=document.getElementById('no-results');
  if(!all.length){ g.innerHTML=''; nr.classList.remove('hidden'); } else { nr.classList.add('hidden'); g.innerHTML=all.map(e=>eventCardHTML(e)).join(''); }
  const catName=categories.find(c=>c.id===currentCat)?.name||'All';
  document.getElementById('page-title').textContent=q?`Results for "${q}"`:(currentCat==='all'?'All Events':`${catName} Events`);
  document.getElementById('result-count').textContent=`${all.length} event${all.length!==1?'s':''} found`;
}
renderCatPills();
document.getElementById('search-input').value=currentQ;
document.getElementById('search-input').addEventListener('input',renderEvents);
document.getElementById('sort-select').addEventListener('change',renderEvents);
renderEvents();
window.addEventListener('ev-state-change',renderEvents);
</script></body></html>
