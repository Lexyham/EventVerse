<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Official celebrity merchandise — Taylor Swift, Beyoncé, Burna Boy and more. Shop official merch on EventVerse.">
<title>Official Merch Shop — EventVerse</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<link rel="stylesheet" href="css/main.css"></head>
<body><div id="header-placeholder"></div>
<main class="page-top" style="padding-bottom:80px"><div class="container" style="padding-top:28px">
  <div class="section-tag" style="margin-bottom:10px">🛍️ Celebrity Store</div>
  <h1 style="font-family:Poppins,sans-serif;font-size:clamp(24px,5vw,40px);font-weight:900;color:#fff;margin-bottom:6px">Official <span class="gradient-text">Merch</span></h1>
  <p style="color:#64748b;font-size:14px;margin-bottom:20px">Authentic merchandise from your favourite artists. New drops added by admin regularly.</p>
  <div id="merch-cart-bar" class="hidden" style="background:rgba(108,43,217,.1);border:1px solid rgba(108,43,217,.25);border-radius:16px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px">
    <div style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">🛒</span><span id="merch-cart-summary" style="color:#fff;font-size:14px;font-weight:600"></span></div>
    <a href="cart.html" class="btn btn-primary btn-sm">Checkout →</a>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px">
    <div style="position:relative;flex:1;min-width:200px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" style="position:absolute;left:12px;top:50%;transform:translateY(-50%)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="merch-search" class="ev-input" placeholder="Search products, artists..." style="padding-left:38px" oninput="renderProducts()"></div>
    <select id="merch-cat" class="ev-input" style="width:auto;min-width:130px" onchange="renderProducts()"><option value="all">All Categories</option><option value="apparel">Apparel</option><option value="accessories">Accessories</option><option value="collectibles">Collectibles</option><option value="digital">Digital</option></select>
    <select id="merch-artist" class="ev-input" style="width:auto;min-width:150px" onchange="renderProducts()"><option value="all">All Artists</option></select>
  </div>
  <p id="merch-count" style="color:#64748b;font-size:13px;margin-bottom:16px"></p>
  <div id="products-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px"></div>
</div></main>
<div id="footer-placeholder"></div>
<script src="js/ev-core-data.js"></script><script src="js/ev-extra-data.js"></script><script src="js/store.js"></script><script src="js/components.js"></script>
<script>
function getAllProducts(){
  const s=EVStore.getState();
  const adminP=(s.adminProducts||[]).map(p=>({id:p.id,name:p.name,artist:p.artist,category:p.category,price:p.price,currency:p.currency||'USD',image:p.image||p.imageUrl||'https://images.unsplash.com/photo-1620799140188-3b2a02fd9a77?w=600&q=80',description:p.description,inStock:p.inStock,badge:p.badge,rating:p.rating||4.5,reviewCount:p.reviewCount||0}));
  return [...adminP,...products];
}
function populateArtists(all){
  const artists=['all',...new Set(all.map(p=>p.artist))];
  const sel=document.getElementById('merch-artist'); const cur=sel.value;
  sel.innerHTML=artists.map(a=>`<option value="${a}">${a==='all'?'All Artists':a}</option>`).join('');
  if(artists.includes(cur)) sel.value=cur;
}
function renderProducts(){
  const all=getAllProducts(); populateArtists(all);
  const q=(document.getElementById('merch-search').value||'').toLowerCase();
  const cat=document.getElementById('merch-cat').value;
  const artist=document.getElementById('merch-artist').value;
  let filtered=all;
  if(q) filtered=filtered.filter(p=>p.name.toLowerCase().includes(q)||p.artist.toLowerCase().includes(q));
  if(cat!=='all') filtered=filtered.filter(p=>p.category===cat);
  if(artist!=='all') filtered=filtered.filter(p=>p.artist===artist);
  document.getElementById('merch-count').textContent=`${filtered.length} product${filtered.length!==1?'s':''} found`;
  const s=EVStore.getState();
  document.getElementById('products-grid').innerHTML=filtered.map(p=>{
    const inCart=s.merchCart.find(i=>i.productId===p.id);
    const cs=currencySymbol(p.currency||'USD');
    return`<div class="ev-card" style="display:flex;flex-direction:column;${!p.inStock?'opacity:.75':''}">
      <div style="position:relative;height:150px;overflow:hidden"><img src="${p.image}" alt="${p.name}" loading="lazy" style="width:100%;height:100%;object-fit:cover">
        ${p.badge?`<div style="position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;color:#fff">${p.badge}</div>`:''}
        ${!p.inStock?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center"><span style="color:#fff;font-weight:800;font-size:14px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:10px">SOLD OUT</span></div>`:''}
      </div>
      <div style="padding:12px;flex:1;display:flex;flex-direction:column">
        <p style="color:#A78BFA;font-size:10px;font-weight:600;margin-bottom:3px;word-wrap:break-word">${p.artist}</p>
        <h3 style="color:#fff;font-size:13px;font-weight:700;line-height:1.35;margin-bottom:4px;flex:1;word-wrap:break-word">${p.name}</h3>
        <p style="color:#475569;font-size:11px;margin-bottom:8px;word-wrap:break-word">${(p.description||'').slice(0,60)}</p>
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:10px"><span style="color:#F59E0B;font-size:12px">★</span><span style="color:#F59E0B;font-size:12px;font-weight:700">${p.rating}</span>${p.reviewCount?`<span style="color:#475569;font-size:10px">(${p.reviewCount.toLocaleString()})</span>`:''}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
          <span style="color:#A78BFA;font-weight:900;font-size:15px">${cs}${p.price}</span>
          <button onclick="addMerchToCart('${p.id}')" ${!p.inStock?'disabled':''} id="merch-btn-${p.id}" style="padding:6px 12px;border-radius:10px;font-size:11px;font-weight:700;cursor:${p.inStock?'pointer':'not-allowed'};border:none;${!p.inStock?'background:rgba(255,255,255,.06);color:#475569':inCart?'background:rgba(34,197,94,.15);color:#22C55E':'background:linear-gradient(135deg,#6C2BD9,#EC4899);color:#fff'}">${!p.inStock?'Sold Out':inCart?'✅ In Cart':'🛒 Add'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const total=s.merchCart.reduce((t,i)=>t+i.price*i.quantity,0), count=s.merchCart.reduce((c,i)=>c+i.quantity,0);
  if(count>0){ document.getElementById('merch-cart-bar').classList.remove('hidden'); document.getElementById('merch-cart-summary').textContent=`${count} item${count>1?'s':''} in cart · $${total.toLocaleString()}`; }
  else document.getElementById('merch-cart-bar').classList.add('hidden');
}
function addMerchToCart(pid){
  const p=getAllProducts().find(x=>x.id===pid); if(!p||!p.inStock) return;
  EVStore.addToMerchCart({id:'merch-'+p.id,productId:p.id,name:p.name,artist:p.artist,image:p.image,price:p.price,quantity:1});
  showToast(`${p.name} added to cart!`,'success',2500);
  renderProducts();
}
window.addMerchToCart=addMerchToCart;
renderProducts();
window.addEventListener('ev-state-change',renderProducts);
</script></body></html>
